name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR replaces a run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    # The app targets iOS 26.5, so it needs an Xcode 26 runner
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Unit tests
        run: scripts/test.sh unit

      - name: UI tests
        run: scripts/test.sh ui

      - name: Keep test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*.xcresult
          retention-days: 14
